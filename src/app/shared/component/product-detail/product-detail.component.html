<div class="row" *ngIf="productArr.length >0;else noproduct">
    <div class="col-md-8">
        <mat-card>
            <mat-card-title>{{productObj.productName}}</mat-card-title>
            <mat-card-subtitle>
                <img   [src]="productObj.productImage" alt="">
            </mat-card-subtitle>
           <mat-card-content>
            <p>
                {{productObj.description}}
            </p>
            <strong>
                {{productObj.orderStatus}}
            </strong>
           </mat-card-content>
            <mat-card-actions class="d-flex justify-content-between">
                <button mat-raised-button color="primary"
                (click)="gotoform()"
                
                >
                    <mat-icon>edit</mat-icon>
                </button>
                <button mat-raised-button color="warn"
                (click)="onremove(productObj.productId)">
                    <mat-icon>delete</mat-icon>
                </button>
            </mat-card-actions>
        </mat-card>
    </div>
</div>


<ng-template #noproduct>
    <p class="alert alert-info">pls Enter valid product</p>
</ng-template>
